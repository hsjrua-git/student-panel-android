name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web bundle, sync Capacitor Android, and assemble debug APK
        run: |
          cd client
          npm ci
          cp mobile.env.example .env.mobile.local
          npm run build
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload StudentPanel-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentPanel-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
